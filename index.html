<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>יומן אימונים</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    line-height: 1.55;
    background: #f4f1ec;
    color: #1c1a17;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16140f; color: #f2ede3; }
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; width: 100%; }
  header { margin-bottom: 18px; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0 0 4px; }
  .sub { color: #57534a; font-size: 15px; margin: 0; }
  @media (prefers-color-scheme: dark) { .sub { color: #b3ab9c; } }
  h2 { font-size: 20px; margin: 0 0 10px; }
  section { margin-bottom: 22px; }
  .card {
    background: #fffdf9;
    border: 1px solid #d9d2c4;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    min-width: 0;
  }
  @media (prefers-color-scheme: dark) {
    .card { background: #201d17; border-color: #3a352b; }
  }
  .card .date { color: #57534a; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .card .date { color: #b3ab9c; } }
  .badge {
    display: inline-block;
    background: #fbe9dd;
    color: #c2410c;
    font-weight: 700;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .next-letter { font-size: 26px; font-weight: 800; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .cards { grid-template-columns: 1fr; } }
  .letter-card h3 { margin: 0 0 2px; font-size: 20px; }
  .letter-card .date { display: block; margin-bottom: 6px; }
  .muted { color: #57534a; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .muted { color: #b3ab9c; } }
  .prog-card h3 { margin: 0 0 2px; font-size: 19px; }
  .prog-card h3 .he { font-weight: 400; font-size: 14px; color: #57534a; }
  @media (prefers-color-scheme: dark) { .prog-card h3 .he { color: #b3ab9c; } }
  .prog-line { font-weight: 700; font-size: 15px; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .prog-line .delta { color: #c2410c; }
  .chart { margin: 6px 0 2px; color: #1c1a17; }
  @media (prefers-color-scheme: dark) { .chart { color: #f2ede3; } }
  .obs { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; color: #57534a; }
  .obs li { padding: 1px 0; }
  @media (prefers-color-scheme: dark) { .obs { color: #b3ab9c; } }
  /* One exercise inside a workout card: name + load, then its own history graph. */
  .ex-block { padding: 10px 0; border-top: 1px solid #d9d2c4; min-width: 0; }
  .ex-block:first-child { border-top: none; padding-top: 2px; }
  @media (prefers-color-scheme: dark) { .ex-block { border-top-color: #3a352b; } }
  .ex-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .ex-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .ex-name .note { display: block; font-weight: 400; font-size: 13px; color: #57534a; }
  @media (prefers-color-scheme: dark) { .ex-name .note { color: #b3ab9c; } }
  .ex-load { font-weight: 700; font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ex-load .unit { font-size: 12px; font-weight: 500; color: #57534a; }
  .ex-delta { font-size: 13px; color: #57534a; margin-top: 2px; font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) { .ex-delta { color: #b3ab9c; } }
  .chart.mini { margin: 4px 0 0; }
  #status { color: #57534a; }
  footer { color: #57534a; font-size: 13px; margin-top: 8px; }
  @media (prefers-color-scheme: dark) { footer, #status { color: #b3ab9c; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>יומן אימונים</h1>
    <p class="sub">THE WORKSHOP Strength Club · שני וחמישי 08:00 · אימונים A ו־C לסירוגין</p>
  </header>

  <p id="status" role="status">טוען אימונים…</p>

  <section id="last-section" hidden>
    <h2>האימון האחרון</h2>
    <div class="card" id="last-card"></div>
  </section>

  <section id="next-section" hidden>
    <h2>האימון הבא</h2>
    <div class="card" id="next-card"></div>
  </section>

  <section id="progress-section" hidden>
    <h2>התקדמות לפי תרגיל ואימון</h2>
    <div id="progress"></div>
  </section>

  <section id="letters-section" hidden>
    <h2>משקלים אחרונים לפי אימון</h2>
    <div class="cards" id="letters"></div>
  </section>

  <section id="history-section" hidden>
    <h2>היסטוריה</h2>
    <div id="history"></div>
  </section>

  <footer id="updated"></footer>
</main>

<script>
// Official exercise names from THE WORKSHOP program sheet (23/11/2026).
// Oren does only workouts A and C (no B). Stored workout data may use the
// old Hebrew names — canonKey() normalises both to the same exercise.
// KEY RULE: an exercise belongs to a specific workout letter. Deadlift in A
// and Deadlift in C are DIFFERENT histories — every graph is keyed by
// (letter, exercise), never by exercise alone.
var EXERCISES = {
  'back-squat':  { name: 'Back Squat',     he: 'בק סקוואט' },
  'pull-ups':    { name: 'Pull Ups',       he: 'פול אפס' },
  'deadlift':    { name: 'Deadlift',       he: 'דדליפט' },
  'dips':        { name: 'Dips',           he: 'דיפס' },
  'goblet-squat':{ name: 'Goblet Squat',   he: 'גובלט סקוואט' },
  'bench-press': { name: 'Bench Press',    he: 'חזה' },
  'dar-lunges':  { name: 'D.A.R Lunges',   he: '' },
  'double-kb-row':{ name: 'Double KB Row', he: 'חתירה' },
  'kb-swing':    { name: 'KB Swing',       he: 'סוויפט' }
};
// Program order on the sheet: A first, then C (B is not done).
var PROGRAM_ORDER = ['back-squat', 'pull-ups', 'deadlift', 'dips', 'goblet-squat',
                     'bench-press', 'dar-lunges', 'double-kb-row', 'kb-swing'];
var NAME_TO_KEY = {
  'back squat': 'back-squat', 'בק סקוואט': 'back-squat', 'סקוואט': 'back-squat',
  'pull ups': 'pull-ups', 'פול אפס': 'pull-ups',
  'deadlift': 'deadlift', 'דדליפט': 'deadlift',
  'dips': 'dips', 'דיפס': 'dips',
  'goblet squat': 'goblet-squat', 'גובלט סקוואט': 'goblet-squat',
  'bench press': 'bench-press', 'חזה': 'bench-press',
  'd.a.r lunges': 'dar-lunges',
  'double kb row': 'double-kb-row', 'חתירה': 'double-kb-row',
  'kb swing': 'kb-swing', 'סוויפט': 'kb-swing'
};
function canonKey(name) {
  if (!name) return null;
  return NAME_TO_KEY[String(name).trim().toLowerCase()] || null;
}
// History key: letter + exercise. Same exercise name in another letter
// is a different series.
function histKey(letter, ex) {
  var k = canonKey(ex.name);
  if (!k) k = 'raw:' + String(ex.name).trim().toLowerCase();
  return letter + '|' + k;
}
function displayName(ex) {
  var k = canonKey(ex.name);
  return k ? EXERCISES[k].name : ex.name;
}
function hebrewName(ex) {
  var k = canonKey(ex.name);
  return k ? EXERCISES[k].he : '';
}
function keyLabel(k) {
  if (k.indexOf('raw:') === 0) return k.slice(4);
  var def = EXERCISES[k];
  return def ? def.name : k;
}
function keyHebrew(k) {
  if (k.indexOf('raw:') === 0) return '';
  var def = EXERCISES[k];
  return def ? def.he : '';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtNum(v) {
  return String(Math.round(v * 10) / 10);
}
function fmtDate(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  if (parts.length !== 3) return esc(iso);
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function fmtDateShort(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  if (parts.length !== 3) return esc(iso);
  return parts[2] + '/' + parts[1];
}
function weekdayHe(iso) {
  try {
    var d = new Date(iso + 'T12:00:00');
    return ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'][d.getDay()];
  } catch (e) { return ''; }
}
function loadText(ex) {
  var bits = [];
  if (ex.load != null && ex.load !== '') bits.push(esc(fmtNum(ex.load)) + ' <span class="unit">ק״ג</span>');
  if (ex.reps != null && ex.reps !== '') bits.push('×' + esc(fmtNum(ex.reps)));
  if (ex.sets != null && ex.sets !== '') bits.push(esc(ex.sets) + ' סטים');
  return bits.join(' · ') || '—';
}
// Numeric value of one logged exercise: load (kg) if present, else reps.
function exValue(ex) {
  if (ex.load != null && ex.load !== '') return { v: Number(ex.load), unit: 'kg' };
  if (ex.reps != null && ex.reps !== '') return { v: Number(ex.reps), unit: 'reps' };
  return null;
}
function unitLabel(unit) { return unit === 'kg' ? 'ק״ג' : 'חזרות'; }
function chartSVG(points, opts) {
  opts = opts || {};
  var W = 300, H = opts.small ? 72 : 96, PL = 18, PR = 18, PT = 20, PB = 20;
  var vals = points.map(function (p) { return p.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  var pad = (max - min) * 0.2; min -= pad; max += pad;
  function x(i) { return points.length === 1 ? W / 2 : PL + (W - PL - PR) * (i / (points.length - 1)); }
  function y(v) { return PT + (H - PT - PB) * (1 - (v - min) / (max - min)); }
  // First/last labels anchor inward so "16/11" is not clipped at the edge.
  function anchor(i) { return points.length === 1 ? 'middle' : (i === 0 ? 'start' : (i === points.length - 1 ? 'end' : 'middle')); }
  var line = points.map(function (p, i) {
    return (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1);
  }).join(' ');
  var dots = points.map(function (p, i) {
    return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="4" fill="#c2410c"/>';
  }).join('');
  var labels = points.map(function (p, i) {
    return '<text x="' + x(i).toFixed(1) + '" y="' + (y(p.v) - 8).toFixed(1) + '" text-anchor="' + anchor(i) + '" font-size="12" font-weight="700" fill="currentColor">' + esc(fmtNum(p.v)) + '</text>';
  }).join('');
  var dates = points.map(function (p, i) {
    return '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor(i) + '" font-size="11" fill="currentColor" opacity="0.7">' + fmtDateShort(p.date) + '</text>';
  }).join('');
  return '<svg class="chart' + (opts.small ? ' mini' : '') + '" direction="ltr" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="גרף התקדמות">' +
    '<path d="' + line + '" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labels + dates + '</svg>';
}
// One exercise inside a workout card: name + this workout's load, then
// the history graph of THIS exercise in THIS letter only.
function exerciseBlock(ex, letter, hist) {
  var obs = hist[histKey(letter, ex)] || [];
  var numeric = obs.filter(function (o) { return o.val; });
  var subs = [];
  var he = hebrewName(ex);
  if (he) subs.push(he);
  if (ex.note) subs.push(ex.note);
  var html = '<div class="ex-block"><div class="ex-head">' +
    '<span class="ex-name"><span dir="ltr">' + esc(displayName(ex)) + '</span>' +
    (subs.length ? '<span class="note">' + subs.map(esc).join(' · ') + '</span>' : '') + '</span>' +
    '<span class="ex-load">' + loadText(ex) + '</span></div>';
  if (numeric.length) {
    html += chartSVG(numeric.map(function (o) { return { date: o.date, v: o.val.v }; }), { small: true });
    if (numeric.length > 1) {
      var first = numeric[0].val.v, lastV = numeric[numeric.length - 1].val.v;
      var delta = Math.round((lastV - first) * 10) / 10;
      html += '<div class="ex-delta">' + esc(fmtNum(first)) + ' ← ' + esc(fmtNum(lastV)) + ' ' + esc(unitLabel(numeric[0].val.unit)) +
        ' (' + (delta >= 0 ? '+' : '') + esc(fmtNum(delta)) + ')</div>';
    }
  }
  return html + '</div>';
}
function workoutCard(w, hist, badgeText, showDate) {
  var badge = badgeText ? '<span class="badge">' + esc(badgeText) + '</span>' : '';
  var dateLine = showDate === false ? '' :
    '<div class="date">אימון ' + esc(w.letter) + ' · ' + esc(weekdayHe(w.date)) + ' ' + fmtDate(w.date) + '</div>';
  return badge + dateLine +
    (w.exercises || []).map(function (ex) { return exerciseBlock(ex, w.letter, hist); }).join('');
}
// All logged observations grouped by (letter, exercise), oldest first.
function buildHist(workouts) {
  var h = {};
  workouts.forEach(function (w) {
    (w.exercises || []).forEach(function (ex) {
      var k = histKey(w.letter, ex);
      (h[k] = h[k] || []).push({ date: w.date, letter: w.letter, val: exValue(ex), note: ex.note || '' });
    });
  });
  Object.keys(h).forEach(function (k) {
    h[k].sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  });
  return h;
}

async function main() {
  var status = document.getElementById('status');
  var data;
  try {
    var res = await fetch('/api/workouts');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    status.textContent = 'לא הצלחתי לטעון את האימונים. נסה לרענן.';
    return;
  }
  var workouts = data.workouts || [];
  if (!workouts.length) {
    status.textContent = 'אין עדיין אימונים מתועדים. שלח אימון אחרי האימון הבא והוא יופיע כאן.';
    return;
  }
  status.hidden = true;
  var hist = buildHist(workouts);

  // Last workout only, with its latest weights + per-exercise graphs.
  var last = workouts[0];
  document.getElementById('last-card').innerHTML = workoutCard(last, hist, null);
  document.getElementById('last-section').hidden = false;

  // Next workout: opposite letter of the newest logged workout.
  var nextLetter = last.letter === 'A' ? 'C' : 'A';
  var prevSame = (data.last_by_letter && data.last_by_letter[nextLetter]) || null;
  var nextCard = document.getElementById('next-card');
  if (prevSame) {
    nextCard.innerHTML = '<div class="next-letter">אימון ' + esc(nextLetter) + '</div>' +
      '<p class="muted">פעם קודמת — ' + esc(weekdayHe(prevSame.date)) + ' ' + fmtDate(prevSame.date) + ':</p>' +
      workoutCard(prevSame, hist, null, false);
  } else {
    nextCard.innerHTML = '<div class="next-letter">אימון ' + esc(nextLetter) + '</div>' +
      '<p class="muted">אין עדיין אימון ' + esc(nextLetter) + ' מתועד — זו תהיה הפעם הראשונה.</p>';
  }
  document.getElementById('next-section').hidden = false;

  // Progress, split by (letter, exercise): Deadlift in A and Deadlift in C
  // are separate cards with separate graphs.
  var progEl = document.getElementById('progress');
  ['A', 'C', 'B'].forEach(function (letter) {
    var keys = Object.keys(hist)
      .filter(function (k) { return k.indexOf(letter + '|') === 0; })
      .map(function (k) { return k.slice(2); });
    keys.sort(function (a, b) {
      var ia = PROGRAM_ORDER.indexOf(a), ib = PROGRAM_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    keys.forEach(function (k) {
      var obs = hist[letter + '|' + k];
      var div = document.createElement('div');
      div.className = 'card prog-card';
      var he = keyHebrew(k);
      var title = '<h3><span dir="ltr">' + esc(keyLabel(k)) + '</span> · אימון ' + esc(letter) +
        (he ? ' <span class="he">· ' + esc(he) + '</span>' : '') + '</h3>';
      var numeric = obs.filter(function (o) { return o.val; });
      var html = title;
      if (numeric.length) {
        var unit = numeric[0].val.unit;
        var first = numeric[0].val.v, lastV = numeric[numeric.length - 1].val.v;
        var delta = Math.round((lastV - first) * 10) / 10;
        html += '<p class="prog-line">' + esc(fmtNum(first)) + ' ← ' + esc(fmtNum(lastV)) + ' ' + esc(unitLabel(unit)) +
          (numeric.length > 1 ? ' <span class="delta">(' + (delta >= 0 ? '+' : '') + esc(fmtNum(delta)) + ')</span>' : '') + '</p>';
        html += chartSVG(numeric.map(function (o) { return { date: o.date, v: o.val.v }; }));
      }
      html += '<ul class="obs">' + obs.map(function (o) {
        var valTxt = o.val
          ? (o.val.unit === 'kg' ? esc(fmtNum(o.val.v)) + ' ק״ג' : '×' + esc(fmtNum(o.val.v)))
          : '—';
        var bits = [fmtDate(o.date) + ' · אימון ' + esc(o.letter) + ' — ' + valTxt];
        if (o.note) bits.push(esc(o.note));
        return '<li>' + bits.join(' · ') + '</li>';
      }).join('') + '</ul>';
      div.innerHTML = html;
      progEl.appendChild(div);
    });
  });
  document.getElementById('progress-section').hidden = false;

  // Last weights per letter, with per-exercise graphs.
  var lettersEl = document.getElementById('letters');
  ['A', 'C'].forEach(function (letter) {
    var w = data.last_by_letter && data.last_by_letter[letter];
    var div = document.createElement('div');
    div.className = 'card letter-card';
    div.innerHTML = w
      ? '<h3>אימון ' + esc(letter) + '</h3><span class="date">' + esc(weekdayHe(w.date)) + ' ' + fmtDate(w.date) + '</span>' +
        workoutCard(w, hist, null, false)
      : '<h3>אימון ' + esc(letter) + '</h3><p class="muted">עדיין לא תועד.</p>';
    lettersEl.appendChild(div);
  });
  document.getElementById('letters-section').hidden = false;

  // Full history, newest first — each card carries its exercises' graphs.
  var histEl = document.getElementById('history');
  workouts.forEach(function (w) {
    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = workoutCard(w, hist, null);
    histEl.appendChild(div);
  });
  document.getElementById('history-section').hidden = false;

  if (data.meta && data.meta.updated) {
    document.getElementById('updated').textContent = 'עודכן: ' + data.meta.updated;
  }
}
main();
</script>
</body>
</html>
